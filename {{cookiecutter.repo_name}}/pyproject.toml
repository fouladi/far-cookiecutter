[project]
name = "{{cookiecutter.repo_name}}"
version = "{{cookiecutter.version}}"
authors = [{ name = "{{cookiecutter.author}}", email = "{{cookiecutter.email}}" }]
license = "{{cookiecutter.license}}"
requires-python = ">={{cookiecutter.python_version}}"
description = "{{cookiecutter.description}}"
readme = "README.md"

[project.urls]
"Homepage" = "https://github.com/{{cookiecutter.github_username}}/{{cookiecutter.repo_name}}"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "prek",
]

[tool.ruff]
line-length = 120
fix = false
show-fixes = true
target-version = "py{{cookiecutter.python_version | replace('.', '') | truncate(3, False, '')}}"

[tool.ruff.lint]
# E: pycodestyle error, F: pyflakes are 'select'ed by default
extend-select = [
    "W",  # pycodestyle warning
    "I",  # isort
    "UP", # pyupgrade
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.coverage.run]
source = ["{{cookiecutter.repo_name}}"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",   # Have to re-enable the standard pragma
  "def __repr__",
  "def __str__",
  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:"
]
